<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body class="no-sidebar is-preload">
<div id="page-wrapper">

    <section th:replace="~{fragments/layout :: menu}"></section>

    <section id="main" class="wrapper style2">
        <div class="container">

            <h2 th:text="${title}">Cím</h2>

            <form class="query-form" th:action="@{/actual_prices}" th:object="${form}" method="post">
                <label>Instrumentum
                    <select th:field="*{instrument}">
                        <option th:each="i : ${instruments}" th:value="${i}" th:text="${i}"></option>
                    </select>
                </label>
                <button type="submit">Lekérdezés</button>
            </form>

            <p class="error" th:if="${error}" th:text="${error}"></p>

            <table class="rates" style="max-width:none" th:if="${prices}">
                <thead>
                <tr><th>Instrumentum</th><th>Időpont (UTC)</th><th>Bid</th><th>Ask</th><th>Kereskedhető</th></tr>
                </thead>
                <tbody>
                <tr th:each="p : ${prices}">
                    <td th:text="${p.instrument}"></td>
                    <td th:text="${#strings.replace(#strings.substring(p.time.toString(), 0, 19), 'T', ' ')}"></td>
                    <td th:text="${p.closeoutBid}"></td>
                    <td th:text="${p.closeoutAsk}"></td>
                    <td th:text="${p.tradeable} ? 'igen' : 'nem (zárt piac)'"></td>
                </tr>
                </tbody>
            </table>

        </div>
    </section>

    <section th:replace="~{fragments/layout :: footer}"></section>

</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
