<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body class="no-sidebar is-preload">
<div id="page-wrapper">

	<section th:replace="~{fragments/layout :: menu}"></section>

	<div id="main" class="wrapper style2">
		<div class="title" th:text="${title}">Cím</div>
		<div class="container">
			<article class="box post">
				<header class="style1">
					<h2 th:text="${title}">Cím</h2>
					<p>Ez az oldal még nincs elkészítve.</p>
				</header>
			</article>
		</div>
	</div>

	<section th:replace="~{fragments/layout :: footer}"></section>

</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
