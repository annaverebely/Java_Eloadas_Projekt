spring.application.name=beadando
server.port=8080

# React menü: H2 adatbázis (C:\data\foglalkoztatas.mv.db)
spring.datasource.url=jdbc:h2:file:C:/data/foglalkoztatas
spring.datasource.username=sa
spring.datasource.password=
# a táblákat a JPA hozza létre az Entity osztályokból, és megtartja őket
spring.jpa.hibernate.ddl-auto=update
# H2 konzol a böngészőben: http://localhost:8080/h2-console
spring.h2.console.enabled=true
# a REST hibaüzenetei (pl. "Nincs ilyen megye!") eljussanak a React oldalhoz
server.error.include-message=always
